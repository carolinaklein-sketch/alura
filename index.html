<!DOCTYPE html>
<html lang="pt-br">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>blog</title>
     <style> 
        header {
            background-color: #27CFC7;
            color: #FFEBE8;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        main {   
            background-color: #EAF6AD;
            color: #10288C;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
        }    
        img {
            width: 80px;     
            height: 80px;
        }
        .artigo-autor {
            font-weight: bold;     
        }
     </style>
</head>

<body>
     <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre a banda Slipknot</p>
     </header>
     <main>
        <img src="Gemini_Generated_Image_.png" alt="Um logotipo de ícone quadrado para o blog da banda slipknot em preto e vermelho">
        <div>
          <h2>Meu primeiro post</h2>
          <p class="artigo-autor">Por: Carolina Klein</p>
          <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar curiosidades da banda</p>
          <button>❤️ <span>0</span></button>
        </div>
     </main>

     <script>
        const botao = document.querySelector("button");
        const contador = document.querySelector("button span");

        function botaoClicado() {
            contador.textContent = parseInt(contador.textContent) + 1;
        }

        botao.addEventListener("click", botaoClicado);
     </script>
</body>
</html>
